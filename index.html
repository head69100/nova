<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet Nova</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dynamic-text {
      font-size: 1.3rem;
      color: #00c6ff;
      height: 30px;
      margin-bottom: 25px;
    }

    p {
      color: #cfd8dc;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 Projet Nova</h1>
    <div class="dynamic-text" id="typewriter"></div>
    <p>
      Bienvenue sur la page officielle du projet Nova. Cet espace regroupe toutes les informations, 
      mises à jour et fonctionnalités de mon application.
    </p>
    <a href="https://github.com/head69100/nova" class="btn" target="_blank">Voir sur GitHub</a>
  </div>

  <script>
    // Effet texte dynamique (Typewriter)
    const words = ["Bienvenue !", "Découvrez le Projet Nova", "Créatif & Innovant"];
    let i = 0, j = 0, isDeleting = false;

    function type() {
      const currentWord = words[i];
      const target = document.getElementById("typewriter");

      if (isDeleting) {
        target.textContent = currentWord.substring(0, j - 1);
        j--;
      } else {
        target.textContent = currentWord.substring(0, j + 1);
        j++;
      }

      if (!isDeleting && j === currentWord.length) {
        isDeleting = true;
        setTimeout(type, 2000);
      } else if (isDeleting && j === 0) {
        isDeleting = false;
        i = (i + 1) % words.length;
        setTimeout(type, 500);
      } else {
        setTimeout(type, isDeleting ? 50 : 100);
      }
    }

    type();
  </script>
</body>
</html>
